<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Railway Reservation System - Login / Register</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>

<body class="bg-gradient-to-br from-slate-900 via-blue-950 to-slate-900 min-h-screen flex flex-col items-center justify-center p-4">

    <!-- Back to Landing Page link -->
    <div class="w-full max-w-md mb-4 flex items-center justify-between">
        <a href="/" class="inline-flex items-center gap-2 text-sm text-blue-200 hover:text-white transition">
            <i class="fa-solid fa-arrow-left"></i>
            <span>Back to Home / Landing Page</span>
        </a>
        <span class="text-xs text-blue-300/70 font-mono">DBMS Portal</span>
    </div>

    <div class="bg-white/95 backdrop-blur-md w-full max-w-md p-8 rounded-2xl shadow-2xl border border-white/20">

        <div class="flex items-center justify-center gap-2 mb-2 text-blue-700">
            <i class="fa-solid fa-train-subway text-2xl"></i>
            <h1 class="text-2xl font-bold tracking-tight">
                Railway Reservation
            </h1>
        </div>

        <p class="text-center text-gray-500 mb-4 text-sm">
            Access your passenger account or manage bookings
        </p>

        <!-- Database Status Indicator -->
        <div id="dbStatus" class="mb-5 flex items-center justify-center gap-2 text-xs py-1.5 px-3 rounded-full bg-emerald-50 text-emerald-700 font-medium border border-emerald-200">
            <span class="inline-block w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
            <span>Checking database connection...</span>
        </div>

        <!-- Tabs -->
        <div class="flex mb-6 border-b border-gray-200">
            <button
                id="loginTab"
                onclick="showLogin()"
                class="w-1/2 py-2.5 font-semibold text-blue-600 border-b-2 border-blue-600 flex items-center justify-center gap-2 transition">
                <i class="fa-solid fa-right-to-bracket text-xs"></i> Login
            </button>

            <button
                id="registerTab"
                onclick="showRegister()"
                class="w-1/2 py-2.5 font-semibold text-gray-500 hover:text-gray-700 flex items-center justify-center gap-2 transition">
                <i class="fa-solid fa-user-plus text-xs"></i> Register
            </button>
        </div>

        <!-- LOGIN FORM -->
        <form id="loginForm" class="space-y-4">
            <div>
                <label class="block mb-1 text-xs font-semibold uppercase tracking-wider text-gray-700">
                    Email Address
                </label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400">
                        <i class="fa-regular fa-envelope"></i>
                    </span>
                    <input
                        type="email"
                        id="loginEmail"
                        required
                        class="w-full border border-gray-300 pl-10 pr-4 py-2.5 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none"
                        placeholder="e.g. user@example.com">
                </div>
            </div>

            <div>
                <label class="block mb-1 text-xs font-semibold uppercase tracking-wider text-gray-700">
                    Password
                </label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400">
                        <i class="fa-solid fa-lock"></i>
                    </span>
                    <input
                        type="password"
                        id="loginPassword"
                        required
                        class="w-full border border-gray-300 pl-10 pr-4 py-2.5 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none"
                        placeholder="Enter your password">
                </div>
            </div>

            <button
                type="submit"
                id="loginBtn"
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-3 rounded-lg shadow-md hover:shadow-lg transition flex items-center justify-center gap-2">
                <i class="fa-solid fa-arrow-right-to-bracket"></i>
                <span>Login</span>
            </button>
        </form>

        <!-- REGISTER FORM -->
        <form id="registerForm" class="hidden space-y-4">
            <div>
                <label class="block mb-1 text-xs font-semibold uppercase tracking-wider text-gray-700">
                    Full Name
                </label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400">
                        <i class="fa-regular fa-user"></i>
                    </span>
                    <input
                        type="text"
                        id="registerName"
                        required
                        class="w-full border border-gray-300 pl-10 pr-4 py-2.5 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none"
                        placeholder="e.g. John Doe">
                </div>
            </div>

            <div>
                <label class="block mb-1 text-xs font-semibold uppercase tracking-wider text-gray-700">
                    Email Address
                </label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400">
                        <i class="fa-regular fa-envelope"></i>
                    </span>
                    <input
                        type="email"
                        id="registerEmail"
                        required
                        class="w-full border border-gray-300 pl-10 pr-4 py-2.5 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none"
                        placeholder="e.g. john@example.com">
                </div>
            </div>

            <div>
                <label class="block mb-1 text-xs font-semibold uppercase tracking-wider text-gray-700">
                    Phone Number
                </label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400">
                        <i class="fa-solid fa-phone"></i>
                    </span>
                    <input
                        type="text"
                        id="registerPhone"
                        required
                        class="w-full border border-gray-300 pl-10 pr-4 py-2.5 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none"
                        placeholder="e.g. 9876543210">
                </div>
            </div>

            <div>
                <label class="block mb-1 text-xs font-semibold uppercase tracking-wider text-gray-700">
                    Password
                </label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400">
                        <i class="fa-solid fa-lock"></i>
                    </span>
                    <input
                        type="password"
                        id="registerPassword"
                        required
                        class="w-full border border-gray-300 pl-10 pr-4 py-2.5 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none"
                        placeholder="Create a strong password">
                </div>
            </div>

            <div>
                <label class="block mb-1 text-xs font-semibold uppercase tracking-wider text-gray-700">
                    Role
                </label>
                <select
                    id="registerRole"
                    class="w-full border border-gray-300 px-3 py-2.5 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none bg-white">
                    <option value="Passenger">Passenger</option>
                    <option value="Admin">Admin</option>
                </select>
            </div>

            <button
                type="submit"
                id="registerBtn"
                class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-3 rounded-lg shadow-md hover:shadow-lg transition flex items-center justify-center gap-2">
                <i class="fa-solid fa-user-check"></i>
                <span>Register Account</span>
            </button>
        </form>

        <!-- MESSAGE -->
        <p id="message" class="text-center mt-5 text-sm font-medium"></p>

        <!-- Demo credentials info -->
        <div class="mt-6 pt-4 border-t border-gray-100 text-center">
            <span class="text-xs text-gray-400">Railway Reservation System &bull; DBMS Project</span>
        </div>
    </div>

<script>
const API_URL = "/api";

// Check Database Connection Status
async function checkDbStatus() {
    const statusEl = document.getElementById("dbStatus");
    if (!statusEl) return;
    try {
        const res = await fetch(`${API_URL}/db-status`);
        const data = await res.json();
        if (res.ok && data.status === 'connected') {
            statusEl.className = "mb-5 flex items-center justify-center gap-2 text-xs py-1.5 px-3 rounded-full bg-emerald-50 text-emerald-700 font-medium border border-emerald-200";
            statusEl.innerHTML = `<span class="inline-block w-2 h-2 rounded-full bg-emerald-500"></span> Database connected: <strong>${data.database}</strong>`;
        } else {
            statusEl.className = "mb-5 flex items-center justify-center gap-2 text-xs py-1.5 px-3 rounded-full bg-rose-50 text-rose-700 font-medium border border-rose-200";
            statusEl.innerHTML = `<span class="inline-block w-2 h-2 rounded-full bg-rose-500"></span> Database disconnected`;
        }
    } catch {
        statusEl.className = "mb-5 flex items-center justify-center gap-2 text-xs py-1.5 px-3 rounded-full bg-amber-50 text-amber-700 font-medium border border-amber-200";
        statusEl.innerHTML = `<span class="inline-block w-2 h-2 rounded-full bg-amber-500"></span> Server offline`;
    }
}
checkDbStatus();

// SHOW LOGIN
function showLogin() {
    document.getElementById("loginForm").classList.remove("hidden");
    document.getElementById("registerForm").classList.add("hidden");

    document.getElementById("loginTab").className = "w-1/2 py-2.5 font-semibold text-blue-600 border-b-2 border-blue-600 flex items-center justify-center gap-2 transition";
    document.getElementById("registerTab").className = "w-1/2 py-2.5 font-semibold text-gray-500 hover:text-gray-700 flex items-center justify-center gap-2 transition";
    document.getElementById("message").textContent = "";
}

// SHOW REGISTER
function showRegister() {
    document.getElementById("loginForm").classList.add("hidden");
    document.getElementById("registerForm").classList.remove("hidden");

    document.getElementById("registerTab").className = "w-1/2 py-2.5 font-semibold text-blue-600 border-b-2 border-blue-600 flex items-center justify-center gap-2 transition";
    document.getElementById("loginTab").className = "w-1/2 py-2.5 font-semibold text-gray-500 hover:text-gray-700 flex items-center justify-center gap-2 transition";
    document.getElementById("message").textContent = "";
}

// REGISTER
document.getElementById("registerForm").addEventListener("submit", async function(event) {
    event.preventDefault();
    const messageEl = document.getElementById("message");
    messageEl.className = "text-center mt-5 text-sm font-medium text-gray-500";
    messageEl.textContent = "Registering...";

    const name = document.getElementById("registerName").value.trim();
    const email = document.getElementById("registerEmail").value.trim();
    const phone = document.getElementById("registerPhone").value.trim();
    const password = document.getElementById("registerPassword").value;
    const role = document.getElementById("registerRole").value;

    try {
        const response = await fetch(`${API_URL}/register`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ name, email, phone, password, role })
        });

        const data = await response.json();
        if (response.ok) {
            messageEl.className = "text-center mt-5 text-sm font-medium text-emerald-600";
            messageEl.textContent = data.message || "Registration successful! Please login.";
            document.getElementById("registerForm").reset();
            setTimeout(showLogin, 1200);
        } else {
            messageEl.className = "text-center mt-5 text-sm font-medium text-rose-600";
            messageEl.textContent = data.error || "Registration failed.";
        }
    } catch (error) {
        messageEl.className = "text-center mt-5 text-sm font-medium text-rose-600";
        messageEl.textContent = "Cannot connect to server.";
    }
});

// LOGIN
document.getElementById("loginForm").addEventListener("submit", async function(event) {
    event.preventDefault();
    const messageEl = document.getElementById("message");
    messageEl.className = "text-center mt-5 text-sm font-medium text-gray-500";
    messageEl.textContent = "Logging in...";

    const email = document.getElementById("loginEmail").value.trim();
    const password = document.getElementById("loginPassword").value;

    try {
        const response = await fetch(`${API_URL}/login`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email, password })
        });

        const data = await response.json();
        if (response.ok) {
            messageEl.className = "text-center mt-5 text-sm font-medium text-emerald-600";
            messageEl.textContent = `Welcome, ${data.user.name}! Redirecting...`;
            localStorage.setItem("railway_user", JSON.stringify(data.user));
            setTimeout(() => {
                window.location.href = "/dashboard";
            }, 1000);
        } else {
            messageEl.className = "text-center mt-5 text-sm font-medium text-rose-600";
            messageEl.textContent = data.error || "Login failed.";
        }
    } catch (error) {
        messageEl.className = "text-center mt-5 text-sm font-medium text-rose-600";
        messageEl.textContent = "Cannot connect to server.";
    }
});
</script>

</body>
</html>
